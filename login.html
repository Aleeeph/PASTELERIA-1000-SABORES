<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Pastelería 1000 Sabores</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container nav-wrap">
    <a href="index.html" class="brand"><span class="mark">1000</span> Pastelería 1000 Sabores</a>
    <button class="nav-toggle" aria-label="Abrir menú">☰</button>
    <nav aria-label="Navegación principal">
      <ul class="main-nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
    <div class="nav-actions">
      <a href="carrito.html" class="cart-link">🛒 Carrito (<span id="contador-carrito">0</span>)</a>
    </div>
  </div>
</header>

<main class="container" style="padding:3rem 1.5rem 4rem; display:flex; flex-direction:column; align-items:center;">
  <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=200&q=80" alt="Pastelería 1000 Sabores" style="width:72px;height:72px;object-fit:cover;border-radius:50%;margin-bottom:1rem;">
  <h1 style="text-align:center;">Pastelería 1000 Sabores</h1>

  <form class="form-card" id="form-login" novalidate style="width:100%;">
    <div class="form-msg" role="alert"></div>
    <h2>Inicio de sesión</h2>

    <div class="form-row" id="row-correo">
      <label for="login-correo">Correo</label>
      <input type="email" id="login-correo" maxlength="100" placeholder="nombre@duoc.cl">
      <span class="field-error"></span>
    </div>

    <div class="form-row" id="row-password">
      <label for="login-password">Contraseña</label>
      <input type="password" id="login-password" minlength="4" maxlength="10">
      <span class="field-error"></span>
      <p class="hint">Entre 4 y 10 caracteres.</p>
    </div>

    <button type="submit" class="btn btn-primary" style="width:100%;">Iniciar sesión</button>
    <p class="hint" style="text-align:center;margin-top:1rem;">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>.</p>
  </form>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© <span id="anio-actual"></span> Pastelería 1000 Sabores.</span>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/validaciones.js"></script>
</body>
</html>
